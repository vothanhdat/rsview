[package]
name = "jsonview"
version = "0.21.4"
edition = "2021"
description = "Browse, navigate and search multi-GB JSON in the terminal at near-constant memory (mmap + lazy byte-range parsing)"
authors = ["Dat Vo <datvogpt@gmail.com>"]
license = "MIT"
repository = "https://github.com/vothanhdat/rsview"
homepage = "https://github.com/vothanhdat/rsview"
readme = "README.md"
keywords = ["json", "tui", "viewer", "mmap", "ratatui"]
categories = ["command-line-utilities", "visualization"]
exclude = ["/.github"]

# The crate publishes as `jsonview` (a clearer search term than `jview`), but
# the binary, repo, and GitHub release archives are all `jview` — so keep that
# as the installed command name.
[[bin]]
name = "jview"
path = "src/main.rs"

# `cargo binstall jsonview` fetches the prebuilt GitHub release archives, which
# are named `jview-<target>` (built by .github/workflows/release.yml), not the
# crate name. Map binstall to them explicitly.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/jview-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
memmap2 = "0.9"
ratatui = "0.29"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
# Detect the terminal's background (OSC 11, with tmux/screen + timeout handling)
# so the few absolute background shades can suit a light or dark theme.
terminal-colorsaurus = "0.4"

# Only for the piped-stdin path: reopen the real terminal device onto fd 0 so
# crossterm reads keys from it (see reattach_terminal_to_stdin in main.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Test-only oracle: the property test parses the same bytes with serde_json and
# asserts our lazy byte-range tree reconstructs an identical value. Not linked
# into the shipped binary.
[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
