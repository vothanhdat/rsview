[package]
name = "jview"
version = "0.20.2"
edition = "2021"
description = "Browse, navigate and search multi-GB JSON in the terminal at near-constant memory (mmap + lazy byte-range parsing)"
authors = ["Dat Vo <datvogpt@gmail.com>"]
license = "MIT"
repository = "https://github.com/vothanhdat/rsview"
homepage = "https://github.com/vothanhdat/rsview"
readme = "README.md"
keywords = ["json", "tui", "viewer", "mmap", "ratatui"]
categories = ["command-line-utilities", "visualization"]
exclude = ["/.github"]

[dependencies]
memmap2 = "0.9"
ratatui = "0.29"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }

# Only for the piped-stdin path: reopen the real terminal device onto fd 0 so
# crossterm reads keys from it (see reattach_terminal_to_stdin in main.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Test-only oracle: the property test parses the same bytes with serde_json and
# asserts our lazy byte-range tree reconstructs an identical value. Not linked
# into the shipped binary.
[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
