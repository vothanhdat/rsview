name: release

# Build prebuilt binaries for all common platforms and attach them to the
# GitHub Release whenever a v* tag is pushed. The archive names are
# cargo-binstall-compatible, so `cargo binstall jview` pulls these directly.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The upload action below attaches assets to an existing release but does not
  # create one, so make it first (idempotent — tolerate an existing release).
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --repo "$GITHUB_REPOSITORY" \
                 --title "jview $GITHUB_REF_NAME" \
                 --notes "Prebuilt binaries for Linux (x86_64/arm64), macOS (Intel/Apple Silicon), and Windows. Or install with \`cargo binstall jview\`."

  upload-binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl Linux builds: no glibc dependency, so they run on any
          # distro (and Alpine). A glibc build on ubuntu-latest links against
          # that runner's new glibc and won't run on older systems.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # Cross-compile the Intel build on the Apple-Silicon runner — the
          # dedicated macos-13 Intel runners are scarce and queue for ages.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and upload jview
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: jview
          target: ${{ matrix.target }}
          # → jview-<target>.tar.gz (.zip on Windows), uploaded to the tag's release.
          archive: $bin-$target
          token: ${{ secrets.GITHUB_TOKEN }}

  # The `curl … /stable/install.sh` one-liner in the README is served from the
  # `stable` branch, not `main`, so users never pipe the dev tip into a shell.
  # Move `stable` forward to this released (already CI-green) commit. Same-repo
  # write via the existing GITHUB_TOKEN — no extra permissions, no PAT.
  promote-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need history back to `stable` so the push has all objects
      - name: Fast-forward stable to this tag
        run: git push origin "HEAD:refs/heads/stable"
