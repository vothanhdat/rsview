name: release

# Build prebuilt binaries for all common platforms and attach them to the
# GitHub Release whenever a v* tag is pushed. The archive names are
# cargo-binstall-compatible, so `cargo binstall rsview` pulls these directly.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The upload action below attaches assets to an existing release but does not
  # create one, so make it first (idempotent — tolerate an existing release).
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --repo "$GITHUB_REPOSITORY" \
                 --title "rsview $GITHUB_REF_NAME" \
                 --notes "Prebuilt binaries for Linux (x86_64/arm64), macOS (Intel/Apple Silicon), and Windows. Or install with \`cargo binstall rsview\`."

  upload-binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # Cross-compile the Intel build on the Apple-Silicon runner — the
          # dedicated macos-13 Intel runners are scarce and queue for ages.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and upload rsview
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: rsview
          target: ${{ matrix.target }}
          # → rsview-<target>.tar.gz (.zip on Windows), uploaded to the tag's release.
          archive: $bin-$target
          token: ${{ secrets.GITHUB_TOKEN }}
